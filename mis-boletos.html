<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Boletos - Cine API</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/chat.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>
<body>
    <!-- Contenedor principal que será movido al layout -->
    <div class="mis-boletos-container">
        <div class="page-header">
            <h1><i class="fas fa-receipt"></i> Mis Boletos</h1>
        </div>
        
        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>
        
        <div id="boletosContainer" class="boletos-grid">
            <div class="empty-state">
                <i class="fas fa-spinner fa-spin"></i>
                <p>Cargando tus boletos...</p>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/mis-boletos.js"></script>
</body>
</html>
